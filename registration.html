<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Копилка — Регистрация</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <style>
        /* ── reset & base ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #F6F8FA;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* ── главный контейнер ── */
        .page {
            position: relative;
            width: 1440px;
            height: 1024px;
            background: #F6F8FA;
            flex-shrink: 0;
            overflow: hidden;
        }

        /* ── КОПИЛКА (заголовок) ── */
        .kopilka-title {
            position: absolute;
            width: 258px;
            height: 48px;
            left: 51px;
            top: 39px;
            font-weight: 800;
            font-size: 40px;
            line-height: 48px;
            color: #144733;
        }

        /* ── зелёный прямоугольник "ФИНАНСОВАЯ ИГРА" ── */
        .game-badge {
            position: absolute;
            width: 266px;
            height: 57px;
            left: 56px;
            top: 108px;
            background: #C7F26B;
            border-radius: 33px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .game-badge span {
            font-weight: 600;
            font-size: 20px;
            line-height: 24px;
            color: #144733;
        }

        /* ── иконка (Group 6) ── */
        .icon-decor {
            position: absolute;
            width: 69px;
            height: 63.19px;
            left: 278px;
            top: 15px;
            pointer-events: none;
        }
        .icon-decor img {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* ── заголовок "Как тебя зовут?" ── */
        .register-title {
            position: absolute;
            width: 620px;
            height: 70.2px;
            left: 56px;
            top: 190px;
            font-weight: 700;
            font-size: 52px;
            line-height: 63px;
            color: #0B1638;
        }

        /* ── подзаголовок ── */
        .register-subtitle {
            position: absolute;
            width: 620px;
            height: 32.4px;
            left: 58px;
            top: 255px;
            font-weight: 400;
            font-size: 24px;
            line-height: 29px;
            color: #6F7890;
        }

        /* ── белая карточка регистрации ── */
        .register-card {
            position: absolute;
            width: 780px;
            height: 430px;
            left: 330px;
            top: 330px;
            background: #FFFFFF;
            border-radius: 28px;
            padding: 60px 0 0 60px;
        }

        /* ── "Введи свое имя" ── */
        .input-label {
            font-weight: 600;
            font-size: 20px;
            line-height: 24px;
            color: #6F7890;
            margin-bottom: 13px;
        }

        /* ── поле ввода ── */
        .input-field {
            width: 660px;
            height: 68px;
            background: #F5F7F2;
            border-radius: 14px;
            border: none;
            padding: 0 25px;
            font-family: 'Inter', sans-serif;
            font-weight: 400;
            font-size: 22px;
            line-height: 27px;
            color: #18213A;
            outline: none;
            transition: border 0.2s;
        }
        .input-field::placeholder {
            color: #18213A;
            opacity: 0.6;
        }
        .input-field:focus {
            border: 2px solid #144733;
            background: #FFFFFF;
        }

        /* ── кнопка "Продолжить →" ── */
        .btn-continue {
            width: 660px;
            height: 68px;
            margin-top: 37px;
            background: #144733;
            border-radius: 14px;
            border: none;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 24px;
            line-height: 29px;
            color: #FFFFFF;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-continue:hover {
            background: #1a5a47;
        }

        /* ── подпись под кнопкой ── */
        .input-hint {
            margin-top: 20px;
            font-weight: 400;
            font-size: 20px;
            line-height: 24px;
            color: #6F7890;
        }

        /* ── адаптив ── */
        @media (max-width: 1440px) {
            .page {
                transform: scale(0.8);
                transform-origin: top left;
            }
        }
        @media (max-width: 1200px) {
            .page {
                transform: scale(0.6);
                transform-origin: top left;
            }
        }
        @media (max-width: 900px) {
            .page {
                transform: scale(0.45);
                transform-origin: top left;
            }
        }
        @media (max-width: 600px) {
            .page {
                transform: scale(0.3);
                transform-origin: top left;
            }
        }
    </style>
</head>
<body>

<div class="page">

    <!-- заголовок "КОПИЛКА" -->
    <div class="kopilka-title">КОПИЛКА</div>

    <!-- зелёный чип "ФИНАНСОВАЯ ИГРА" -->
    <div class="game-badge"><span>ФИНАНСОВАЯ ИГРА</span></div>

    <!-- иконка Group 6 -->
    <div class="icon-decor">
        <img src="icon.svg" alt="Иконка" />
    </div>

    <!-- заголовок "Как тебя зовут?" -->
    <div class="register-title">Как тебя зовут?</div>

    <!-- подзаголовок -->
    <div class="register-subtitle">Имя будет отображаться в игре и в твоём прогрессе.</div>

    <!-- белая карточка регистрации -->
    <div class="register-card">
        <div class="input-label">Введи свое имя</div>

        <!-- поле ввода -->
        <input class="input-field" type="text" placeholder="" />

        <!-- кнопка "Продолжить →" -->
        <button class="btn-continue" data-go="portfolio.html">Продолжить →</button>

        <!-- подпись под кнопкой -->
        <div class="input-hint">Можно использовать настоящее имя или никнейм.</div>
    </div>

</div>

    <script src="./pages/app-shell.js"></script>
</body>
</html>
