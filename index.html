<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игра «КОПИЛКА»</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #07111f;
            --panel: rgba(10, 19, 34, 0.9);
            --panel-2: rgba(17, 30, 54, 0.95);
            --border: rgba(255,255,255,0.08);
            --text: #f4f6fb;
            --muted: #8fa0bd;
            --accent: #3b82f6;
            --accent-2: #2dd4bf;
            --danger: #ff4d6d;
            --shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
            color: var(--text);
            background: radial-gradient(circle at top left, #14345d 0%, #14345d 50%, var(--bg) 65%, #050b14 100%);
            padding: 0;
            overflow-x: hidden;
        }

        .app-shell {
            max-width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-height: calc(100vh - 48px);
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 20px;
            background: var(--panel);
            box-shadow: var(--shadow);
            backdrop-filter: blur(18px);
        }

        .cash-pill {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .label {
            font-size: 0.76rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .cash-value {
            font-size: 1.4rem;
            font-weight: 700;
        }

        .secondary {
            color: var(--muted);
            font-size: 0.95rem;
        }

        .btn {
            border: none;
            border-radius: 999px;
            padding: 10px 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn-primary {
            color: white;
            background: linear-gradient(135deg, var(--accent), #5b93ff);
            box-shadow: 0 12px 24px rgba(59, 130, 246, 0.28);
        }

        .btn-secondary {
            color: var(--text);
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--border);
        }

        .btn-muted {
            color: var(--muted);
            background: transparent;
            border: 1px solid var(--border);
        }

        .asset-section {
            border: 1px solid var(--border);
            border-radius: 20px;
            background: var(--panel);
            box-shadow: var(--shadow);
            backdrop-filter: blur(18px);
            padding: 16px;
            flex: 1 1 auto;
            min-height: 0;
        }

        .asset-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            gap: 12px;
        }

        .asset-header h2 {
            margin: 0 0 4px;
            font-size: 1.15rem;
        }

        .asset-header p {
            margin: 0;
            color: var(--muted);
            font-size: 0.95rem;
        }

        .day-pill {
            position: relative;
            overflow: hidden;
            color: var(--muted);
            font-size: 0.95rem;
            padding: 8px 12px;
            border-radius: 999px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.06);
            min-width: 132px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            isolation: isolate;
        }

        .day-pill::before {
            content: '';
            position: absolute;
            inset: 0 auto 0 0;
            width: var(--fill, 0%);
            background: linear-gradient(90deg, rgba(45,212,191,0.22), rgba(59,130,246,0.28));
            border-radius: 999px;
            z-index: 0;
            transition: width 0.1s linear;
        }

        .day-pill-label {
            position: relative;
            z-index: 1;
            white-space: nowrap;
        }

        .asset-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr));
            gap: 14px;
            align-content: start;
            height: 100%;
            min-height: 0;
        }

        .instrument-card {
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: clamp(8px, 1vw, 12px);
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: linear-gradient(135deg, rgba(59,130,246,0.16), rgba(45,212,191,0.08));
            transition: transform 0.2s ease, border-color 0.2s ease;
            min-height: 0;
            transform: scale(1);
            font-size: clamp(0.85rem, 0.9vw, 0.9rem);
        }

        .instrument-card:hover {
            transform: translateY(-2px);
            border-color: rgba(59,130,246,0.35);
        }

        .instrument-head {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            align-items: flex-start;
        }

        .instrument-name {
            font-size: 1rem;
            font-weight: 700;
        }

        .instrument-ticker {
            margin-top: 2px;
            font-size: 0.78rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .instrument-pill {
            font-size: 0.77rem;
            padding: 6px 10px;
            border-radius: 999px;
            background: rgba(255,255,255,0.07);
            color: var(--muted);
            white-space: nowrap;
        }

        .instrument-pill-spacer {
            content: '';
            flex: 1;
        }

        .instrument-price-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 10px;
        }

        .price-value {
            font-size: clamp(1rem, 1.1vw, 1.2rem);
            font-weight: 700;
        }

        .price-value.up { color: #2dd4bf; }
        .price-value.down { color: #ff4d6d; }

        .price-change {
            font-size: clamp(0.78rem, 0.86vw, 0.9rem);
            font-weight: 600;
        }

        .price-change.up { color: #2dd4bf; }
        .price-change.down { color: #ff4d6d; }

        .metric-label {
            font-size: 0.72rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 4px;
        }

        .metric-value {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .candle-wrap {
            margin-top: 2px;
            border-radius: 8px;
            padding: 4px;
            background: rgba(255,255,255,0.03);
            cursor: pointer;
            transition: background 0.12s ease;
            height: 36px;
            overflow: hidden;
        }

        .candle-wrap svg { height: 36px !important; }

        .card-controls {
            display: flex;
            gap: 6px;
            align-items: center;
            margin-top: auto;
            justify-content: space-between;
        }

        .card-amount {
            width: clamp(70px, 6.5vw, 100px);
            border: 1px solid var(--border);
            border-radius: 10px;
            background: rgba(255,255,255,0.04);
            color: var(--text);
            padding: 8px 10px;
            outline: none;
            appearance: none;
            font-size: 0.9rem;
        }

        .action-btn {
            padding: clamp(7px, 0.8vw, 8px) clamp(10px, 1vw, 12px);
            border-radius: 999px;
            font-size: clamp(0.8rem, 0.85vw, 0.9rem);
        }

        .insights {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 20px;
        }

        .insight-card {
            padding: 20px 22px;
        }

        .insight-title {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .portfolio-wrap,
        .log-wrap {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .folio-row,
        .log-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        .empty-state {
            color: var(--muted);
            padding: 10px 0;
        }

        .deposit-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-top: 2px;
        }

        .deposit-line {
            padding: 2px 4px;
            border-radius: 12px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            height: 26px;
            display: flex;
            align-items: center;
        }

        .deposit-line-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            font-size: 12px;
            line-height: 1;
        }

        .deposit-line-top .action-btn {
            padding: 0px 8px;
            height: 20px;
            font-size: 11px;
            line-height: 20px;
        }

        .deposit-lock {
            color: var(--muted);
            font-size: 0.76rem;
        }

        .deposit-empty {
            color: var(--muted);
            font-size: 0.88rem;
            padding: 6px 0;
        }

        .deposit-line-actions {
            display: flex;
            justify-content: flex-end;
        }

        /* Групповая карточка акций */
        .asset-group-card {
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 16px;
            background: linear-gradient(135deg, rgba(59,130,246,0.12), rgba(45,212,191,0.06));
            transition: transform 0.2s ease, border-color 0.2s ease;
            grid-column: 1 / -1; /* занимает всю ширину */
            width: 100%;
        }

        .asset-group-card:hover {
            border-color: rgba(59,130,246,0.35);
        }

        .asset-group-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        .asset-group-header h3 {
            margin: 0;
            font-size: 1.05rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .asset-group-header .group-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .asset-group-header .btn {
            padding: 6px 14px;
            font-size: 0.85rem;
        }

        /* Сетка акций внутри групповой карточки */
        .stock-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr));
            gap: 12px;
        }

        /* Карточка отдельной акции внутри группы */
        .stock-item {
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: 12px 14px;
            background: rgba(255,255,255,0.03);
            transition: background 0.2s ease;
        }

        .stock-item:hover {
            background: rgba(255,255,255,0.06);
        }

        .stock-item .instrument-head {
            display: flex;
            justify-content: space-between;
            gap: 6px;
            align-items: flex-start;
            margin-bottom: 6px;
        }

        .stock-item .instrument-name {
            font-size: 0.95rem;
            font-weight: 700;
        }

        .stock-item .instrument-ticker {
            font-size: 0.72rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .stock-item .instrument-pill {
            font-size: 0.7rem;
            padding: 4px 8px;
            border-radius: 999px;
            background: rgba(255,255,255,0.07);
            color: var(--muted);
            white-space: nowrap;
        }

        .stock-item .instrument-price-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 6px;
        }

        .stock-item .price-value {
            font-size: 1rem;
            font-weight: 700;
        }

        .stock-item .price-change {
            font-size: 0.78rem;
            font-weight: 600;
        }

        .stock-item .price-value.up { color: #2dd4bf; }
        .stock-item .price-value.down { color: #ff4d6d; }
        .stock-item .price-change.up { color: #2dd4bf; }
        .stock-item .price-change.down { color: #ff4d6d; }

        .stock-item .candle-wrap {
            margin: 4px 0 8px;
            border-radius: 10px;
            padding: 4px;
            background: rgba(255,255,255,0.03);
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .stock-item .candle-wrap:hover {
            background: rgba(255,255,255,0.06);
        }

        .stock-item .card-controls {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
        }

        .stock-item .card-amount {
            width: clamp(60px, 5vw, 80px);
            border: 1px solid var(--border);
            border-radius: 8px;
            background: rgba(255,255,255,0.04);
            color: var(--text);
            padding: 6px 8px;
            outline: none;
            font-size: 0.85rem;
        }

        .stock-item .action-btn {
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 0.8rem;
        }

        .event-modal {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: rgba(1, 6, 15, 0.78);
            backdrop-filter: blur(8px);
            z-index: 1000;
        }

        .event-modal.hidden {
            display: none;
        }

        .event-modal-card {
            width: min(92vw, 420px);
            border-radius: 24px;
            padding: 24px;
            border: 1px solid rgba(255,255,255,0.12);
            background: linear-gradient(145deg, rgba(17, 30, 54, 0.98), rgba(10, 19, 34, 0.96));
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
            text-align: center;
        }

        .event-modal-card h3 {
            margin: 12px 0 8px;
            font-size: 1.2rem;
        }

        .event-modal-card p {
            margin: 0 0 18px;
            color: var(--muted);
            line-height: 1.6;
        }

        .event-modal-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .event-modal-actions .btn {
            min-width: 150px;
        }

        .event-modal-actions .btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none;
        }

        .event-modal-icon {
            width: 48px;
            height: 48px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(45, 212, 191, 0.16);
            color: var(--accent-2);
            font-size: 1.3rem;
        }

        /* Модальное окно справки на весь экран */
        .help-modal {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            background: rgba(1, 6, 15, 0.92);
            backdrop-filter: blur(12px);
            z-index: 9999;
        }

        .help-modal.hidden {
            display: none;
        }

        /* Карточка справки на весь экран */
        .help-modal-card {
            width: 100vw;
            height: 100vh;
            max-width: 100%;
            max-height: 100%;
            border-radius: 0;
            padding: 40px 32px 32px;
            border: none;
            background: linear-gradient(160deg, rgba(17, 30, 54, 0.99), rgba(6, 12, 24, 0.98));
            box-shadow: none;
            text-align: left;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        /* Заголовок справки */
        .help-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            margin-bottom: 24px;
            flex-shrink: 0;
        }

        .help-modal-header h2 {
            margin: 0;
            font-size: 1.8rem;
            font-weight: 600;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .help-modal-header h2 .help-icon {
            width: 44px;
            height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(45, 212, 191, 0.18);
            color: var(--accent-2, #2dd4bf);
            font-size: 1.4rem;
        }

        /* Основное содержимое справки - занимает почти весь экран */
        .help-modal-body {
            flex: 1;
            overflow-y: auto;
            padding-right: 8px;
        }

        .help-modal-body::-webkit-scrollbar {
            width: 4px;
        }

        .help-modal-body::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.04);
            border-radius: 4px;
        }

        .help-modal-body::-webkit-scrollbar-thumb {
            background: rgba(45, 212, 191, 0.3);
            border-radius: 4px;
        }

        /* Секции справки */
        .help-section {
            margin-bottom: 28px;
        }

        .help-section h3 {
            font-size: 1.15rem;
            font-weight: 500;
            color: #e8edf5;
            margin: 0 0 10px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .help-section h3 .section-icon {
            font-size: 1.2rem;
        }

        .help-section p {
            margin: 0 0 6px 0;
            color: var(--muted, #8b95a9);
            line-height: 1.7;
            font-size: 0.98rem;
        }

        .help-section ul {
            margin: 8px 0 0 0;
            padding-left: 24px;
            color: var(--muted, #8b95a9);
            line-height: 1.8;
        }

        .help-section ul li {
            margin-bottom: 4px;
        }

        .help-section .help-tip {
            background: rgba(45, 212, 191, 0.07);
            border-left: 3px solid var(--accent-2, #2dd4bf);
            padding: 14px 18px;
            border-radius: 0 10px 10px 0;
            margin-top: 10px;
        }

        .help-section .help-tip p {
            margin: 0;
            color: #c8d0dd;
        }

        /* Кнопки внизу справки */
        .help-modal-footer {
            padding-top: 24px;
            border-top: 1px solid rgba(255,255,255,0.06);
            margin-top: 8px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }

        .help-modal-footer .btn {
            min-width: 140px;
            padding: 12px 28px;
        }

        .help-modal-footer .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        @media (max-width: 900px) {
            .asset-grid {
                grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr));
            }
        }

        @media (max-width: 640px) {
            .app-shell {
                padding: 8px;
                gap: 10px;
            }

            .topbar {
                padding: 12px;
                gap: 8px;
                border-radius: 16px;
                flex-direction: column;
                align-items: stretch;
            }

            .topbar .btn {
                width: 100%;
                text-align: center;
            }

            .asset-section {
                padding: 12px;
                border-radius: 16px;
            }

            .asset-grid {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .instrument-card {
                padding: 12px;
                border-radius: 14px;
            }

            .cash-value {
                font-size: 1.2rem;
            }
            .help-modal-card {
                padding: 24px 18px 20px;
            }

            .help-modal-header h2 {
                font-size: 1.4rem;
            }

            .help-modal-header h2 .help-icon {
                width: 36px;
                height: 36px;
                font-size: 1.1rem;
            }

            .help-modal-footer .btn {
                min-width: 100%;
            }

            .asset-group-card {
                padding: 12px;
                border-radius: 16px;
            }

            .stock-grid {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .stock-item {
                padding: 10px 12px;
            }

            .asset-group-header {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }

            .asset-group-header .group-actions {
                justify-content: flex-end;
            }
        }
        @media (min-width: 641px) and (max-width: 1024px) {
            .app-shell {
                padding: 12px 20px;
            }

            .asset-grid {
                grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr));
            }

            .stock-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <header class="topbar">
            <div class="cash-pill">
                <strong class="cash-value" id="balance">0 руб.</strong>
                <span class="secondary" id="totalState">Общее состояние: 0 руб.</span>
            </div>
            <div class="day-pill" id="day">
                <span class="day-pill-label" id="dayText">День 1 / 365</span>
            </div>
            <button class="btn btn-muted" id="pauseTimer">▶️</button>
            <button class="btn btn-primary" id="nextDay">Следующий день</button>
            <button class="btn btn-muted" id="reset">Сброс</button>
        </header>

        <main class="content">
            <section class="asset-section">
                <div class="asset-grid" id="marketCards"></div>
            </section>
        </main>
    </div>

    <div class="event-modal hidden" id="eventModal" aria-hidden="true">
        <div class="event-modal-card">
            <div class="event-modal-icon">✦</div>
            <h3 id="eventModalTitle">Событие</h3>
            <p id="eventModalText">Текст события</p>
            <div class="event-modal-actions" id="eventModalActions"></div>
        </div>
    </div>

    <div id="helpModal" class="help-modal hidden">
        <div class="help-modal-card">
            <div class="help-modal-header">
                <h2>
                    <span class="help-icon">❓</span>
                    <p id="helpModalTitle">Справка</p>
                </h2>
            </div>
            <div class="help-modal-body">
                <p id="helpModalText">Текст справки</p>
